<div class="filterBar">
    <div class="filterButtonsContainer">
        <button class="activeButton">Active surveys</button>
        <button class="pastButton">Past surveys</button>
    </div>
    <select class="sortByCategory">
        <option value="">Sort by category</option>
        <option value="team-activities">Team Activities</option>
        <option value="health-wellness">Health & Wellness</option>
        <option value="gaming-entertainment">Gaming & Entertainment</option>
        <option value="education-learning">Education & Learning</option>
        <option value="lifestyle-preferences">Lifestyle & Preferences</option>
        <option value="technology-innovation">Technology & Innovation</option>
    </select>
</div>

<div class="surveyCardsContainer">

    <div class="surveyCard" *ngFor="let survey of surveys">
        <div class="surveyInfo">
            <p class="surveyCategory">{{ survey.category }}</p>
            <p class="surveyName">{{ survey.name }}</p>
        </div>
        <p class="surveyEndDate">Ends in: {{ daysRemaining(survey.end_data) }}</p>
    </div>

</div>
